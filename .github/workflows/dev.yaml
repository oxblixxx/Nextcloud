name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]  # Run on all branches except main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Or your preferred version

    - uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install pre-commit
      run: pip install pre-commit

    - uses: gitleaks/gitleaks-action@v2
      with:
        version: v8.27.0
    # Scan entire repo (not just changes)
        config-path: .gitleaks.toml  # Optional custom config
        command: detect --source=. --verbose --redact

    - name: Run pre-commit on all files
      run: pre-commit run --all-files
